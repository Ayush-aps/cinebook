services:
  mysql-primary:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinebook_db
      MYSQL_USER: cinebook_user
      MYSQL_PASSWORD: cinebook_password
    ports:
      - "3307:3306"
    volumes:
      - ./database/primary/my.cnf:/etc/mysql/my.cnf
      - ./database:/docker-entrypoint-initdb.d
      - ./database/primary/init_replication.sql:/docker-entrypoint-initdb.d/init_replication.sql
      - cinebook_mysql_primary_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1" ]
      timeout: 20s
      retries: 10

  mysql-replica:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinebook_db
      MYSQL_USER: cinebook_user
      MYSQL_PASSWORD: cinebook_password
    ports:
      - "3308:3306"
    volumes:
      - ./database/replica/my.cnf:/etc/mysql/my.cnf
      - ./database/replica/start_replication.sh:/start_replication.sh
      - cinebook_mysql_replica_data:/var/lib/mysql
    depends_on:
      mysql-primary:
        condition: service_healthy
    entrypoint: [ "bash", "-c", "/start_replication.sh & docker-entrypoint.sh mysqld" ]

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql-primary
      DB_USER: cinebook_user
      DB_PASSWORD: cinebook_password
      DB_NAME: cinebook_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql-primary:
        condition: service_healthy

  booking-primary:
    build: ./services/booking-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql-primary
      DB_READ_HOST: mysql-replica
      DB_USER: cinebook_user
      DB_PASSWORD: cinebook_password
      DB_NAME: cinebook_db
      INSTANCE_ID: primary
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_started

  booking-backup:
    build: ./services/booking-service
    ports:
      - "3003:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql-primary
      DB_READ_HOST: mysql-replica
      DB_USER: cinebook_user
      DB_PASSWORD: cinebook_password
      DB_NAME: cinebook_db
      INSTANCE_ID: backup
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_started

  watchdog:
    build: ./watchdog
    environment:
      PRIMARY_URL: http://booking-primary:3002
      BACKUP_URL: http://booking-backup:3002
      CHECK_INTERVAL: 3000
    depends_on:
      - booking-primary
      - booking-backup

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - WDS_SOCKET_PORT=0 # Fix for CRA HMR in docker
      - HOST=0.0.0.0 # Bind to all interfaces
      - DANGEROUSLY_DISABLE_HOST_CHECK=true # Allow NGINX proxy host
    stdin_open: true
    tty: true

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - booking-primary
      - booking-backup
      - client
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cinebook_mysql_primary_data:
  cinebook_mysql_replica_data:
